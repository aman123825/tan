name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pytest + self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q
      - name: self-test
        run: python tests/run_selftest.py

  flutter:
    name: Flutter (harnesses + analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart verification harnesses
        run: |
          for h in catalog safety engine stage persistence results recommendation audio gap modulation sequence mci pitch rate speech openset interval chord closed battery timbre identification dichotic fatigue asr norms psychometrics diagnostics psychoacoustics tier3; do
            echo "--- $h ---"
            dart run "tool/verify/${h}_harness.dart"
          done
      - name: Analyze (lib + test)
        run: dart analyze lib test
      - name: Flutter tests
        run: flutter test

  # --- Platform builds (L2/L3/L5): artifacts prove each target compiles ---
  build-web:
    name: Build (web PWA)
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
      - run: flutter pub get
      - name: Build web (release, PWA service worker included)
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: hearbloom-web
          path: apps/flutter_app/build/web
          retention-days: 14

  build-android:
    name: Build (Android APK)
    runs-on: ubuntu-latest
    needs: [backend, flutter]
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
      - run: flutter pub get
      - name: Build APK (release, debug-signed research build)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hearbloom-android
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-windows:
    name: Build (Windows desktop)
    runs-on: windows-latest
    needs: [backend, flutter]
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
      - run: flutter pub get
      - name: Build Windows (release)
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: hearbloom-windows
          path: apps/flutter_app/build/windows/x64/runner/Release
          retention-days: 14
