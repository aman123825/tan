name: hearbloom
version: 0.1.0+1
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  just_audio: ^0.10.6
  fl_chart: ^1.2.0
  intl: ^0.20.3
  google_fonts: ^8.2.0
  # path_provider_android accepts ^1.0.0. Pin the patched release because
  # jni 1.0.1 contains a breaking KGP migration and is retracted.
  jni: 1.0.2
  jni_flutter: 1.0.2
  cryptography: ^2.7.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/protocols/
    - assets/stimuli/
    - assets/stimuli/speech/
    - assets/stimuli/digits/
    - assets/stimuli/letters/
    - assets/stimuli/phonemes/
    - assets/stimuli/words/
    - assets/stimuli/sentences/
    - assets/stimuli/colors/
    - assets/stimuli/matrix/
    - assets/stimuli/food/
    - assets/stimuli/animals/
    - assets/stimuli/speaker/
